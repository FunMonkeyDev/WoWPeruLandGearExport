# Al subir una etiqueta vX.Y arma el ZIP del addon y lo publica en Releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que la etiqueta coincide con el .toc
        run: |
          toc_version=$(grep -oP '^## Version:\s*\K\S+' addon/WowPeruLandGearExport/WowPeruLandGearExport.toc | tr -d '\r')
          if [ "v$toc_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la version del .toc ($toc_version)"
            exit 1
          fi

      - name: Armar el ZIP
        run: |
          cd addon
          zip -r "../WowPeruLandGearExport-$GITHUB_REF_NAME.zip" WowPeruLandGearExport -x "*.md"

      - name: Publicar el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "WowPeruLandGearExport-$GITHUB_REF_NAME.zip" \
            --title "WowPeruLand Gear Export $GITHUB_REF_NAME" --generate-notes
